"hem_1", "label": "hem", "vertex": 294, "radius": 11, "amp_x": 1.77, "amp_y": 1.77, "period": 1.2, "phase": 1.3, "rigid": false}, {"name": "hem_2", "label": "hem", "vertex": 655, "radius": 11, "amp_x": 1.77, "amp_y": 1.77, "period": 1.2, "phase": 2.0, "rigid": false}, {"name": "hem_3", "label": "hem", "vertex": 991, "radius": 11, "amp_x": 1.77, "amp_y": 1.77, "period": 1.2, "phase": 2.7, "rigid": false}, {"name": "hem_4", "label": "hem", "vertex": 1552, "radius": 11, "amp_x": 1.77, "amp_y": 1.77, "period": 1.2, "phase": 3.4, "rigid": false}, {"name": "hem_5", "label": "hem", "vertex": 1662, "radius": 10, "amp_x": 1.77, "amp_y": 1.33, "period": 1.2, "phase": 4.1, "rigid": false}]};
// optional strip-warped patch drawn on top of the mesh (e.g. Rimuru's tassel):
// one feathered patch, row strips with a bottom-weighted ramp — a solid-texture
// region stays rigid. null when the character has no such patch.
const TASSEL = null;
const VIEW = 1.0;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const img = new Image(), timg = new Image();

function smooth01(u) { return u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u); }

// per-vertex normalized IDW weights, precomputed once
let WTS;
function buildWeights() {
  const P = MESH.points, C = MESH.controls;
  WTS = P.map(() => new Float64Array(C.length));
  for (let i = 0; i < P.length; i++) {
    let sum = 0;
    for (let j = 0; j < C.length; j++) {
      const cvx = P[C[j].vertex];
      const d = Math.hypot(P[i][0] - cvx[0], P[i][1] - cvx[1]);
      const w = d < C[j].radius ? smooth01(1 - d / C[j].radius) : 0;
      WTS[i][j] = w; sum += w;
    }
    if (sum > 0) for (let j = 0; j < C.length; j++) WTS[i][j] /= sum;
  }
  // rigid controls claim their disk outright: uniform weight 1, no blending
  for (let j = 0; j < C.length; j++) {
    if (!C[j].rigid) continue;
    const cvx = P[C[j].vertex];
    for (let i = 0; i < P.length; i++) {
      const d = Math.hypot(P[i][0] - cvx[0], P[i][1] - cvx[1]);
      if (d < C[j].radius) {
        WTS[i].fill(0);
        WTS[i][j] = 1;
      }
    }
  }
}

function displaced(t) {
  const out = new Float64Array(MESH.points.length * 2);
  for (let i = 0; i < MESH.points.length; i++) {
    let dx = 0, dy = 0;
    for (let j = 0; j < MESH.controls.length; j++) {
      const w = WTS[i][j];
      if (w === 0) continue;
      const c = MESH.controls[j];
      const s = Math.sin(2 * Math.PI * t / c.period + c.phase);
      dx += w * c.amp_x * s; dy += w * c.amp_y * s;
    }
    out[i * 2] = MESH.points[i][0] + dx;
    out[i * 2 + 1] = MESH.points[i][1] + dy;
  }
  return out;
}

// affine src tri -> dst tri, returns [a,b,c,d,e,f] for ctx.transform
function affineFwd(s, d) {
  const det = (s[0][0] * (s[1][1] - s[2][1]) + s[1][0] * (s[2][1] - s[0][1]) + s[2][0] * (s[0][1] - s[1][1]));
  const solve = (out) => [
    (out[0] * (s[1][1] - s[2][1]) + out[1] * (s[2][1] - s[0][1]) + out[2] * (s[0][1] - s[1][1])) / det,
    (s[0][0] * (out[1] - out[2]) + s[1][0] * (out[2] - out[0]) + s[2][0] * (out[0] - out[1])) / det,
    (s[0][0] * (s[1][1] * out[2] - s[2][1] * out[1]) + s[1][0] * (s[2][1] * out[0] - s[0][1] * out[2]) + s[2][0] * (s[0][1] * out[1] - s[1][1] * out[0])) / det,
  ];
  const X = solve([d[0][0], d[1][0], d[2][0]]);
  const Y = solve([d[0][1], d[1][1], d[2][1]]);
  return [X[0], Y[0], X[1], Y[1], X[2], Y[2]];
}

function expandTri(d, pad) {
  const cx = (d[0][0] + d[1][0] + d[2][0]) / 3, cy = (d[0][1] + d[1][1] + d[2][1]) / 3;
  return d.map(([x, y]) => {
    const vx = x - cx, vy = y - cy, n = Math.hypot(vx, vy) || 1;
    return [x + vx / n * pad, y + vy / n * pad];
  });
}

function drawTri(ctx, s, d, k) {
  ctx.save();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.beginPath();
  ctx.moveTo(d[0][0], d[0][1]); ctx.lineTo(d[1][0], d[1][1]); ctx.lineTo(d[2][0], d[2][1]);
  ctx.closePath();
  ctx.clip();
  const m = affineFwd(s, d);
  ctx.transform(m[0], m[1], m[2], m[3], m[4], m[5]);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

let staCv = null, dynTris = [];

function bakeStatic() {
  // triangles whose vertices never move are drawn once into an offscreen canvas
  staCv = document.createElement("canvas");
  staCv.width = MESH.width; staCv.height = MESH.height;
  const sctx = staCv.getContext("2d");
  dynTris = [];
  for (const tri of MESH.tris) {
    const moving = tri.some(v => WTS[v].some(w => w > 0));
    if (moving) { dynTris.push(tri); continue; }
    const s = [MESH.points[tri[0]], MESH.points[tri[1]], MESH.points[tri[2]]];
    drawTri(sctx, s, expandTri(s.map(p => [...p]), 0.8), 1);
  }
}

function draw(t, k) {
  const dp = displaced(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.drawImage(staCv, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const [a, b, c] of dynTris) {
    const s = [MESH.points[a], MESH.points[b], MESH.points[c]];
    const d = expandTri([[dp[a * 2], dp[a * 2 + 1]], [dp[b * 2], dp[b * 2 + 1]], [dp[c * 2], dp[c * 2 + 1]]], 0.8);
    drawTri(ctx, s, d, k);
  }
  // strip patch on top (row-strip warp), when the character has one
  if (TASSEL) {
    const ang = 2 * Math.PI * t / TASSEL.period + TASSEL.phase;
    const sx = Math.sin(ang), sy = Math.cos(ang);
    ctx.save();
    ctx.setTransform(k, 0, 0, k, 0, 0);
    for (let j = 0; j < TASSEL.h; j += 2) {
      const hh = Math.min(2, TASSEL.h - j);
      const w = Math.pow(j / (TASSEL.h - 1), TASSEL.exp);
      ctx.drawImage(timg, 0, j, TASSEL.w, hh,
                    TASSEL.x + TASSEL.amp_x * w * sx, TASSEL.y + j + TASSEL.amp_y * w * sy,
                    TASSEL.w, hh);
    }
    ctx.restore();
  }
  if (document.getElementById("wire").checked) {
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.strokeStyle = "rgba(80,220,120,0.5)";
    ctx.beginPath();
    for (const [a, b, c] of MESH.tris) {
      ctx.moveTo(dp[a * 2], dp[a * 2 + 1]);
      ctx.lineTo(dp[b * 2], dp[b * 2 + 1]);
      ctx.lineTo(dp[c * 2], dp[c * 2 + 1]);
      ctx.closePath();
    }
    ctx.stroke();
  }
}

let lastT = 0;
function start() {
  const dpr = window.devicePixelRatio || 1;
  const k = VIEW * dpr;
  cv.width = MESH.width * k; cv.height = MESH.height * k;
  cv.style.width = MESH.width * VIEW + "px";
  cv.style.height = MESH.height * VIEW + "px";
  buildWeights();
  bakeStatic();
  document.getElementById("wire").onchange = () => draw(lastT, k);

  const pin = new URLSearchParams(location.search).get("t0");
  if (pin !== null) { draw(parseFloat(pin), k); return; }
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { draw(0, k); return; }
  let tPrev = null, tAcc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const tSec = now / 1000;
    if (tPrev === null) tPrev = tSec;
    tAcc += tSec - tPrev;
    tPrev = tSec; lastT = tAcc;
    draw(tAcc, k);
  }
  requestAnimationFrame(frame);
}
let loaded = 0;
const NEED = TASSEL ? 2 : 1;
function onload() { if (++loaded === NEED) start(); }
img.onload = onload;
img.src = SPRITE;
if (TASSEL) { timg.onload = onload; timg.src = TASSEL_IMG; }
</script>
